name: CI & Quality Assurance

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Typst CLI
        run: |
          TYPST_VERSION="0.12.0"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Test Environment
        run: |
          cp .env.example .env
          mkdir -p data/logs data/documents data/dashboards

      - name: Check for Tracked Private Data
        run: |
          python scripts/check_no_private_data.py

      - name: Compile Python Modules
        run: |
          python -m compileall -q async_crawler.py database.py engines_and_auditor.py install_zco_plugin.py portfolio_and_docs_engine.py server.py supervisor.py telegram_bot.py typst_agentic_cv_engine.py web_dashboard.py scripts

      - name: Verify Dependency Consistency
        run: |
          python -m pip check

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v
